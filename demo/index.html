<body class="bg-base-100">
<div class="bg-white border-b border-gray-100 px-8 py-2 overflow-hidden">

    <div class="w-full flex items-center justify-between">

    <div class="space-y-8 px-8 py-6">

        <div class="flex-none">
            <button id="btn-tray-view" class="btn border border-white">Tray View</button>
            <button id="btn-grid-view" class="btn">Grid View</button>
        </div>
    </div>

    <div id="canvas-area"></div>


    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                
                <div class="lg:col-span-3 bg-base-200 rounded-2xl p-6 border border-base-300">
                    <div class="flex">   
                        <h3 class="text-lg font-bold mb-6 flex items-center flex-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary" fill="none"

                        <div class="flex-none">
                            <button class="btn border border-white" id="table-btn">Table</button>
                            <button class="btn" id="chart-btn">Chart</button>

                    </div>
                    <div id="data-analytics-container" class="mt-4 rounded-lg overflow-hidden"></div>
                </div>
               

                <div class="lg:col-span-1 bg-base-200 rounded-2xl p-6 border border-base-300">

                            <thead class="bg-base-300">

    <!-- ============================================================ -->
    <!-- TRAY VIEW MARKUP — inert until cloned by tray_view.js         -->
    <!-- ============================================================ -->
   <template id="tray-view-template">
        <div id="wrapper" class="grid grid-cols-1 lg:grid-cols-4 gap-6 h-[50vh] lg:h-[70vh]">
        
        
            <div
                class="lg:col-span-3 h-full bg-neutral rounded-2xl overflow-hidden border border-base-300 shadow-inner relative">
               <div id="mode-selector">
                    <label><input type="radio" name="viewer_mode" value="pan" id="mode_pan" checked> Default</label>
                    <label><input type="radio" name="viewer_mode" value="create" id="mode_create"> Create Box</label>
                    <label><input type="radio" name="viewer_mode" value="merge" id="mode_merge"> Merge Boxes</label>
                    <label><input type="radio" name="viewer_mode" value="review" id="mode_review"> Laser</label>
                </div>
                <div id="viewer" class="w-full h-full relative"></div>
            </div>
        
            
            <div id="list-column"
                class="lg:col-span-1 bg-base-200 rounded-2xl overflow-hidden flex flex-col border border-base-300">
        
                <div class="p-4 border-b border-base-300 bg-base-300/30">
                    <h2 class="text-lg font-semibold">
                        Detections List
                    </h2>
                    <p class="text-sm text-base-content/70 mt-1">
                        Detections sorted by increasing confidence
                    </p>
                </div>
        
                <div id="scroll-container" class="overflow-y-auto flex-1 p-4">
                    <ul class="space-y-2" id="prediction-list"></ul>
                </div>
        
                <!-- Pagination Btns -->
                <div class="p-4 border-t border-base-300 bg-base-300/20">
                    <div class="flex items-center justify-between">
                        <button id="prev-page-btn" class="btn btn-outline btn-sm">
                            Previous
                        </button>
        
                        <span id="page-indicator" class="text-sm text-base-content/70">
                            Page X of X
                        </span>
        
                        <button id="next-page-btn" class="btn btn-outline btn-sm">
                            Next
                        </button>
                    </div>
                </div>
        
            </div>
        </div>

        <dialog id="imageModal" class="modal">
            <div class="modal-box max-w-5xl h-[90vh] bg-base-100 p-0 overflow-hidden flex flex-col">
                <div class="p-4 bg-base-200 border-b border-base-300 flex justify-between items-center flex-none">
                    <h3 id="modalTitle" class="font-bold text-xl">Title</h3>
                    <form method="dialog"><button class="btn btn-sm btn-circle btn-ghost">✕</button></form>
                </div>
                <div class="p-1 bg-neutral flex-1 overflow-hidden flex items-center justify-center">
                    <img id="modalImage" class="object-contain transition-all duration-300" src="" alt="Detection Thumbnail" />
                </div>
                <div id="prediction-edit" class="hidden space-y-6 py-4">
                    <div>
                        <label class="label">
                            <span class="label-text font-bold uppercase text-xs opacity-70">Override Prediction</span>
                        </label>
                        <select id="prediction-select" class="select select-bordered w-full">
                            <option value="Barley">Barley</option>

                            <option value="B. juncea">Brassica juncea</option>
                            
                            <option value="B. napus">Brassica napus</option>

                            <option value="B. rapa">Brassica rapa</option>
                            
                            <option value="Durum Wheat">Durum Wheat</option>
                            
                            <option value="Red Wheat">Red Wheat</option>
                            
                            <option value="Rye">Rye</option>
                            
                            <option value="Triticale">Triticale</option>
                            
                            <option value="White Wheat">White Wheat</option>
                        </select>
                    </div>
                    <div class="alert alert-warning shadow-lg">
                        <span>Manual override will replace AI prediction.</span>
                    </div>
                    <div class="flex justify-end">
                        <button type="button" id="undo-prediction-btn" class="btn btn-ghost btn-sm">Cancel</button>
                        <button type="button" id="delete-prediction-btn" class="btn btn-error btn-sm">Delete Prediction</button>
                    </div>
                </div>
                <div class="modal-action p-4 bg-base-200 border-t border-base-300 mt-0 flex-none">
                    <button type="button" id="change-prediction-btn" class="btn btn-outline btn-warning">Change Prediction</button>
                    <button type="submit" id="next-btn" class="hidden btn btn-success shadow-lg">Verify & Next</button>
                </div>
            </div>
        </dialog>

        <dialog id="labelPickerModal" class="rounded-xl border border-base-300 shadow-lg p-0 backdrop:bg-black/10">
            <form method="dialog" class="p-3 w-64 space-y-3 bg-base-100 rounded-xl">
                <h3 class="font-semibold text-sm">Choose Class</h3>
                <!-- <select id="labelPickerClassSelect" class="select select-bordered select-sm w-full">

                <label for="classPickerSelect" class="text-xs">Select seed class:</label>
                <select id="classPickerSelect" class="select select-bordered select-sm w-full"></select>
                <label for="labelPickerSelect" class="text-xs">Select seed species:</label>
                <select id="labelPickerSelect" class="select select-bordered select-sm w-full"></select>
                <div class="flex justify-end gap-2">

                    <button id="labelPickerConfirm" type="button" class="btn btn-success btn-sm">Create</button>
                </div>
            </form>
        </dialog>
    </template>

    <!-- GRID VIEW MARKUP                                              -->
    <!-- ============================================================ -->
    <template id="grid-view-template">
    
        <div id="sg-toolbar" class="flex items-center justify-between flex-wrap gap-2">
            <div class="sg-toolbar-left">
                <span id="sg-stats" class="text-[13px] text-white"></span>
            </div>
    
            <div class="sg-toolbar-right flex items-center gap-[10px] flex-wrap">
                <label class="text-[13px] text-white">Cols</label>
                <input type="range" id="sg-col-slider" min="4" max="24" value="10" step="1">
                <span id="sg-col-val" class="text-[13px] font-semibold min-w-8">10</span>
    
                <label class="text-[13px] white">Scale</label>
                <input type="range" id="sg-scale-slider" min="0.25" max="3" value="1" step="0.05">
                <span id="sg-scale-val" class="text-[13px] font-semibold min-w-8">1.0x</span>
    
                <label class="text-[13px] white">Sort By:</label>
                <select id="sort-select">
                    <option value="type">Type</option>
                    <option value="confidence">Confidence</option>
                    <option value="needs_manual_review">Needs manual review</option>
                </select>
    
            </div>
        </div>
    
        <div id="sg-loading" class="p-8 text-center text-sm text-gray-400 border border-dashed border-gray-300 rounded-lg">
            <span id="sg-loading-msg">Loading image…</span>
        </div>
        <div id="wrapper" class="h-[50vh] lg:h-[70vh] grid grid-cols-1 lg:grid-cols-4 gap-6 min-h-0">
    
            <!-- Grid: takes remaining space, scrolls internally -->
            <div id="sg-scroll-outer"
                class="hidden flex-1 lg:col-span-3 min-h-0 overflow-y-auto border border-gray-300 rounded-lg bg-[#f5f2eb] relative">
                <div id="sg-phantom" class="w-full"></div>
                <div id="sg-tiles" class="absolute top-0 left-0 w-full"></div>
            </div>
    
    
            <!-- Detail: fixed-width sidebar, sticky, never scrolls out of view -->
            <div id="sg-detail"
                class="flex-col gap-3 col-span-1 p-3 px-4 rounded-lg bg-base-200 text-[13px] text-gray-600 overflow-y-auto">
                <canvas id="server-thumbnail-img" class="self-center max-w-full h-auto"></canvas>
                <div class="card bg-base-200 border border-base-300 shadow-xl w-full">
    
                    <div class="card-body w-full">
    
                        <!-- Header -->
                        <div class="flex items-center gap-3 mb-2">
    
                            <div>
                                <h2 class="card-title text-xl font-black uppercase text-white">
                                    Model Prediction
                                </h2>
                            </div>
    
                        </div>
    
                        <div class="divider my-1 opacity-40"></div>
    
                        <!-- DISPLAY MODE -->
                        <div id="prediction-display" class="space-y-8 py-4">
    
                            <div>
                                <div class="text-xs font-bold uppercase mb-2 tracking-wider text-white">
                                    Predicted Class
                                </div>
    
                                <div id="selected-seed-type" class="text-3xl font-black text-primary">
                                    Click a seed to see its details
                                </div>
                            </div>
    
                            <div>
                                <div class="text-xs font-bold uppercase mb-2 tracking-wider text-white">
                                    Confidence
                                </div>
    
                                <div id="selected-seed-confidence" class="text-5xl font-black text-success">
                                    
                                </div>
                            </div>
    
                        </div>
    
                        <!-- EDIT MODE -->
                        <div id="prediction-edit" class="hidden space-y-6 py-4">
    
                            <div>
                                <label class="label">
                                    <span class="label-text font-bold uppercase text-xs opacity-70">
                                        Override Prediction
                                    </span>
                                </label>
    
                                <select id="prediction-select" class="select select-bordered w-full">
                                    
                                    <option value="Barley">Barley</option>
                                    
                                    <option value="Buckwheat">Buckwheat</option>
                                    
                                    <option value="Durum Wheat">Durum Wheat</option>
                                    
                                    <option value="Red Wheat">Red Wheat</option>
                                                                        
                                    <option value="Rye">Rye</option>
                                    
                                    <option value="Triticale">Triticale</option>
                                                                        
                                    <option value="White wheat">White wheat</option>

                                </select>
                            </div>
    
                            <div class="flex justify-end gap-4">
                                <button type="button" id="save-prediction-btn" class="btn btn-success btn-sm p-2">
                                    Save
                                </button>
                                <button type="button" id="undo-prediction-btn" class="btn btn-warning btn-sm p-2">
                                    Cancel
                                </button>
                                <button type="button" id="delete-prediction-btn" class="btn btn-error btn-sm p-2">
                                    Delete
                                </button>
                            </div>
    
                        </div>
    
                        <!-- ACTIONS -->
                        <div class="card-actions justify-end gap-3 mt-8 flex-wrap">
    
                            <button type="button" id="change-prediction-btn" class="btn btn-outline btn-warning">
                                Change Prediction
                            </button>
    
                            <button type="button" id="dispatch-laser-btn" class="btn btn-error shadow-lg">
                                Dispatch Laser
                            </button>
    
                        </div>
    
                    </div>
                    </form>
                </div>
            </div>
        </div>
    </template>

    <template id="chart-view-template">
        <div class="flex flex-col md:flex-row gap-6">
            <div class="flex-1 p-4 rounded-xl shadow-sm border border-base-300">
                <canvas id="bar-chart"></canvas>
            </div>
            <div class="flex-1 p-4 rounded-xl shadow-sm border border-base-300">
                <canvas id="pie-chart"></canvas>
            </div>
        </div>
    </template>

    <template id="table-view-template">
        <div id="table-container"></div>
    </template>

    <script type="module">
        import * as store from "/js/prediction_store.js";
        import * as trayView from "/js/tray_view.js";
        import * as gridView from "/js/grid_view.js";
        import * as figures from "/js/figures.js"
        import * as table from "/js/table.js"
        import * as settings from "/js/class_settings.js"

        store.hydrate(
            JSON.parse(document.getElementById('initial-seeds').textContent),
            JSON.parse(document.getElementById('initial-class-settings').textContent),
            {}
        );

        const canvasArea = document.getElementById('canvas-area');
        const analyticsArea = document.getElementById('data-analytics-container');
        let activeView = null;
        let activeAnalytics = null;

        function showView(view) {
            if (activeView) activeView.unmount();
            canvasArea.innerHTML = '';
            view.mount(canvasArea, {
                imageUrl: "/dist/tray.jpg",
                originalWidth: 6765,
                originalHeight: 7695,
                csrftoken: "",
                allSeedTypes: JSON.parse(document.getElementById('all-seed-types')?.textContent ?? '[]'),
                seedClasses: JSON.parse(document.getElementById('seed-classes')?.textContent ?? '[]')
            });
            activeView = view;
        }

        document.getElementById('btn-tray-view').addEventListener('click', () => {
            document.getElementById('btn-tray-view').classList.add('border');
            document.getElementById('btn-tray-view').classList.add('border-white');
            document.getElementById('btn-grid-view').classList.remove('border');
            document.getElementById('btn-grid-view').classList.remove('border-white');
            showView(trayView)
        });
        document.getElementById('btn-grid-view').addEventListener('click', () => {
            document.getElementById('btn-grid-view').classList.add('border');
            document.getElementById('btn-grid-view').classList.add('border-white');
            document.getElementById('btn-tray-view').classList.remove('border');
            document.getElementById('btn-tray-view').classList.remove('border-white');
            showView(gridView)
        });

        showView(trayView);

        function showAnalytics(view) {
            if (activeAnalytics) activeAnalytics.unmount();
            ;
            view.mount(analyticsArea, {});
            activeAnalytics = view;
        }

        document.getElementById('chart-btn').addEventListener('click', () => {
            document.getElementById('chart-btn').classList.add('border');
            document.getElementById('chart-btn').classList.add('border-white');
            document.getElementById('table-btn').classList.remove('border');
            document.getElementById('table-btn').classList.remove('border-white');
            showAnalytics(figures);
        });
        document.getElementById('table-btn').addEventListener('click', () => {
            document.getElementById('table-btn').classList.add('border');
            document.getElementById('table-btn').classList.add('border-white');
            document.getElementById('chart-btn').classList.remove('border');
            document.getElementById('chart-btn').classList.remove('border-white');
            showAnalytics(table);
        });

        showAnalytics(table);

        settings.mount_settings(document.getElementById('visibility-settings'), document.getElementById('class-settings-body'), {});

    </script>
